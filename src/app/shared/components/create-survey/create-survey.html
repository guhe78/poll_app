<section class="create-survey">
  <div class="create-survey__main">
    <header class="create-survey__header">
      <app-status-badge variant="draft" buttonText="Draft"></app-status-badge>
      <div class="create-survey__headline--container">
        <h3 class="create-survey__headline">Create new survey</h3>
        <button class="create-survey__button-cancel" type="button" (click)="closeSurveyForm()">
          <span class="create-survey__button-cancel--text">Cancel</span>
          <span class="create-survey__button-cancel--icon" [innerHTML]="iconsService.close"></span>
        </button>
      </div>
    </header>
    <app-survey-form #surveyForm (surveyCreated)="onSurveyCreated($event)"></app-survey-form>
    <div class="create-survey__info-badge" [class.show]="isVisible()">
      Your survey is now published
    </div>
  </div>
</section>
